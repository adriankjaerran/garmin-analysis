[project]
name = "garmin-analysis"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "fitparse>=1.2",
    "numpy>=2.5.4",
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "pillow>=13.0.0",
    "python-multipart>=0.0.33",
    "pillow-heif>=1.8.1",
]

[project.scripts]
garmin-app = "app.server.__main__:main"
garmin-app-cache = "app.server.fitcache:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# starlette suggests httpx2 for its TestClient; httpx works fine
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
